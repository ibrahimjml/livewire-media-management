name: Build and deploy to AWS ECR

on:
  push:
    branches: [dev]

env:
  AWS_REPOSITORY: livewire_media
  AWS_REGION: us-east-1
  AWS_ECR_REGISTRY: 213462345060.dkr.ecr.us-east-1.amazonaws.com/livewire-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #  Authenticate with AWS via credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      #  Get Auth Token for Docker to push to ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the production image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/DockerFile
          target: production
          push: true
          tags: |
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_REPOSITORY }}:latest
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create VPS application directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: sudo mkdir -p /opt/${{ env.AWS_REPOSITORY }}/infra

      - name: Upload production configuration files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.dev.yml,.env.production.example,infra/01-deploy.sh"
          target: /opt/${{ env.AWS_REPOSITORY }}

      # Execute deployment on the VPS with AWS Credentials
      - name: Execute deployment script
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
        with:
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ECR_REGISTRY
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            chmod +x /opt/${{ env.AWS_REPOSITORY }}/infra/00-deploy.sh
            /bin/sh /opt/${{ env.AWS_REPOSITORY }}/infra/00-deploy.sh
